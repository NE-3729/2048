<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Fredoka:wght@500;600;700&display=swap">
<title>2048 · 网页小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F7E0D3'/%3E%3Crect x='7' y='7' width='22' height='22' rx='7' fill='%23E6FCF1'/%3E%3Crect x='35' y='7' width='22' height='22' rx='7' fill='%23FFE69B'/%3E%3Crect x='7' y='35' width='22' height='22' rx='7' fill='%23FF9068'/%3E%3Crect x='35' y='35' width='22' height='22' rx='7' fill='%236E1B31'/%3E%3C/svg%3E">
<style>
  :root{
    --cream:#FDF3EC;
    --ink:#3F241C;
    --ink-2:#94695A;
    --rule:rgba(120,70,52,.16);
    --coral:#FF9C7F;
    --coral-2:#FF6152;
    --coral-3:#E0473A;
    --glass:rgba(255,255,255,.55);
    --glass-2:rgba(255,255,255,.26);
  }

  *{box-sizing:border-box;}

  html,body{min-height:100%;}

  body{
    margin:0;
    color:var(--ink);
    font-family:"Fredoka","Segoe UI Variable Text","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(16px,4.5vh,44px) 18px;
    min-height:100dvh;
    background-color:var(--cream);
    background-image:
      radial-gradient(58% 52% at 10% 4%, #FFC6A8 0%, rgba(255,198,168,0) 62%),
      radial-gradient(52% 46% at 96% 14%, #FFE2A2 0%, rgba(255,226,162,0) 64%),
      radial-gradient(62% 54% at 84% 100%, #A9EFD3 0%, rgba(169,239,211,0) 62%),
      radial-gradient(48% 44% at 12% 94%, #FFB7BC 0%, rgba(255,183,188,0) 66%);
    background-attachment:fixed;
  }

  .shell{
    position:relative;
    z-index:1;
    width:min(100%,420px,58vh);
    margin:auto;
    display:flex;
    flex-direction:column;
  }

  /* ===== 标题 ===== */
  .title{
    margin:0 0 13px;
    text-align:center;
    font-family:"Fredoka","Segoe UI",system-ui,sans-serif;
    font-size:clamp(34px,10vw,46px);
    line-height:1;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--ink);
    text-shadow:0 2px 0 rgba(255,255,255,.8),0 16px 28px rgba(150,86,64,.16);
  }

  /* ===== 计分与按钮：共用同一套胶囊 ===== */
  .scores{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
  }

  .score-box,
  .btn{
    --p1:#FFC67C;
    --p2:#FFB872;
    --p3:#F89B4C;
    --p4:rgba(248,155,76,.5);
    min-width:0;
    min-height:46px;
    padding:0 18px;
    border:0;
    border-radius:999px;
    display:flex;
    align-items:center;
    color:var(--ink);
    background:linear-gradient(158deg,var(--p1),var(--p2));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.72),
      inset 0 -14px 18px -16px rgba(90,40,25,.45),
      inset 0 0 0 1px rgba(255,255,255,.4),
      0 3px 0 var(--p3),
      0 12px 20px -14px var(--p4);
  }

  .score-box{
    --p1:#76FBC7;
    --p2:#6CEBB9;
    --p3:#3CD19D;
    --p4:rgba(60,209,157,.5);
    justify-content:space-between;
    gap:8px;
  }
  .score-box .label{
    font-size:12px;
    letter-spacing:.08em;
    color:rgba(63,36,28,.62);
    white-space:nowrap;
  }
  .score-box .value{
    font-size:20px;
    font-weight:700;
    line-height:1;
  }
  .score-box--best{
    --p1:#FFA4AB;
    --p2:#FF979E;
    --p3:#FF7881;
    --p4:rgba(255,120,129,.5);
  }

  /* ===== 工具条 ===== */
  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .btn{
    appearance:none;
    font:inherit;
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    width:100%;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.6,.64,1),box-shadow .16s ease,filter .16s ease;
  }
  .btn:hover{filter:brightness(1.04);}
  .btn:active{
    transform:translateY(3px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 0 0 1px rgba(255,255,255,.35),
      0 1px 0 var(--p3),
      0 8px 12px -10px var(--p4);
  }
  .btn--solid{
    --p1:#FFED68;
    --p2:#FFDC5C;
    --p3:#E9C025;
    --p4:rgba(233,192,37,.5);
  }
  .btn--ghost{
    --p1:#FFC67C;
    --p2:#FFB872;
    --p3:#F89B4C;
    --p4:rgba(248,155,76,.5);
  }
  .btn--fill{
    color:#fff;
    text-shadow:0 1px 1px rgba(180,40,30,.35);
    background:linear-gradient(165deg,rgba(255,170,142,.96),rgba(255,97,82,.94));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 -2px 0 rgba(190,45,32,.3),
      0 3px 0 var(--coral-3),
      0 16px 24px -16px rgba(255,90,70,.65);
  }
  .btn--fill:hover{filter:none;background:linear-gradient(165deg,#FFB69E,rgba(255,110,95,.95));}
  .btn--fill:active{
    transform:translateY(3px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 1px 0 var(--coral-3),0 8px 12px -10px rgba(255,90,70,.55);
  }
  .btn:disabled{
    opacity:.42;
    cursor:default;
    transform:none;
    filter:none;
    box-shadow:none;
  }
  .btn:focus-visible{outline:3px solid rgba(255,126,99,.55);outline-offset:3px;}
  .btn .count{
    display:inline-block;
    font-size:11px;
    line-height:1;
    padding:4px 7px;
    border-radius:999px;
    background:rgba(63,36,28,.14);
    color:var(--ink);
  }

  /* ===== 棋盘：磨砂玻璃面板 ===== */
  .board-wrap{display:flex;justify-content:center;}
  .board{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:34px;
    background:linear-gradient(155deg,rgba(255,255,255,.62),rgba(255,255,255,.3) 55%,rgba(255,255,255,.46));
    backdrop-filter:blur(26px) saturate(1.6);
    -webkit-backdrop-filter:blur(26px) saturate(1.6);
    box-shadow:
      0 34px 64px -32px rgba(150,86,64,.5),
      0 2px 6px rgba(150,86,64,.12),
      inset 0 2px 0 rgba(255,255,255,.95),
      inset 0 -16px 28px -16px rgba(255,255,255,.8),
      inset 0 0 0 1px rgba(255,255,255,.42);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    cursor:grab;
    isolation:isolate;
  }
  .board::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:
      radial-gradient(125% 58% at 50% -22%, rgba(255,255,255,.85), rgba(255,255,255,0) 62%),
      radial-gradient(90% 42% at 50% 124%, rgba(255,255,255,.5), rgba(255,255,255,0) 60%);
  }
  .board.dragging{cursor:grabbing;}
  .slots{
    position:absolute;
    inset:var(--pad,14px);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:var(--gap,10px);
    z-index:1;
  }
  .slot{
    background:rgba(255,255,255,.14);
    border-radius:18px;
    box-shadow:
      inset 0 2px 6px rgba(150,90,70,.16),
      inset 0 -1px 0 rgba(255,255,255,.7);
  }

  .tiles{
    position:absolute;
    inset:0;
    z-index:2;
    border-radius:34px;
    overflow:hidden;
    transition:transform .22s cubic-bezier(.34,1.6,.5,1);
    will-change:transform;
  }
  .tiles.live{transition:none;}

  .tile{
    position:absolute;
    top:0;
    left:0;
    width:var(--cell,80px);
    height:var(--cell,80px);
    transition:transform .16s cubic-bezier(.25,1.15,.5,1);
    will-change:transform;
    z-index:2;
  }
  .tile.no-anim{transition:none;}
  .tile-inner{
    position:relative;
    width:100%;
    height:100%;
    border-radius:18px;
    display:grid;
    place-items:center;
    font-family:"Fredoka","Segoe UI",system-ui,sans-serif;
    font-size:calc(var(--cell,80px) * var(--k,.42));
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1;
    overflow:hidden;
    background-image:linear-gradient(158deg,var(--c1),var(--c2));
    color:var(--tc);
    text-shadow:var(--ts);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.95),
      inset 0 0 0 1px rgba(255,255,255,.34),
      inset 0 -3px 7px rgba(255,255,255,.45),
      inset 0 -16px 20px -14px rgba(90,40,25,.32),
      0 12px 20px -12px var(--cs);
  }
  .tile-inner::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    padding:1.5px;
    background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,255,255,.32) 34%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.82));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }
  .tile-inner::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:
      radial-gradient(120% 55% at 50% -18%, rgba(255,255,255,.88), rgba(255,255,255,0) 58%),
      radial-gradient(62% 38% at 22% 18%, rgba(255,255,255,.34), rgba(255,255,255,0) 66%);
  }
  .tile-val{position:relative;z-index:3;}

  .tile-inner.pop{animation:mergeBurst .5s cubic-bezier(.16,.9,.3,1) both;}
  .tile-inner.appear{animation:appear .24s cubic-bezier(.34,1.56,.64,1);}
  @keyframes mergeBurst{
    0%{transform:scale(1.5);opacity:.38;}
    45%{transform:scale(1.1);opacity:.82;}
    72%{transform:scale(.97);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }
  @keyframes appear{
    0%{transform:scale(.42,.56);opacity:.35;}
    62%{transform:scale(1.08,.96);opacity:1;}
    100%{transform:scale(1,1);opacity:1;}
  }

  .t2{--c1:rgba(196,248,228,.9);--c2:rgba(146,226,201,.72);--tc:#1E6B54;--cs:rgba(90,200,150,.42);--ts:0 1px 0 rgba(255,255,255,.6);}
  .t4{--c1:rgba(255,246,186,.94);--c2:rgba(255,224,128,.76);--tc:#6B4E06;--cs:rgba(230,190,80,.48);--ts:0 1px 0 rgba(255,255,255,.6);}
  .t8{--c1:rgba(255,224,184,.94);--c2:rgba(255,190,132,.78);--tc:#7A4118;--cs:rgba(240,168,110,.48);--ts:0 1px 0 rgba(255,255,255,.55);}
  .t16{--c1:rgba(255,198,158,.95);--c2:rgba(255,162,116,.82);--tc:#692F0F;--cs:rgba(250,150,100,.5);--ts:0 1px 0 rgba(255,255,255,.45);}
  .t32{--c1:rgba(255,168,130,.95);--c2:rgba(255,128,88,.86);--tc:#5C2007;--cs:rgba(250,130,90,.55);--ts:0 1px 0 rgba(255,255,255,.4);}
  .t64{--c1:rgba(255,136,110,.96);--c2:rgba(245,104,86,.88);--tc:#48180A;--cs:rgba(245,110,86,.55);--ts:0 1px 0 rgba(255,255,255,.38);}
  .t128{--c1:rgba(242,102,104,.95);--c2:rgba(224,64,86,.9);--tc:#FFF6F3;--cs:rgba(225,72,83,.5);--ts:0 1px 2px rgba(110,15,30,.45);}
  .t256{--c1:rgba(220,78,100,.95);--c2:rgba(196,42,68,.93);--tc:#FFF4F1;--cs:rgba(195,44,70,.5);--ts:0 1px 2px rgba(100,10,30,.5);}
  .t512{--c1:rgba(190,54,82,.96);--c2:rgba(157,32,64,.94);--tc:#FFEFEC;--cs:rgba(158,36,67,.55);--ts:0 1px 2px rgba(90,10,25,.55);}
  .t1024{--c1:rgba(152,40,66,.96);--c2:rgba(118,20,48,.95);--tc:#FFEDE9;--cs:rgba(122,23,51,.55);--ts:0 1px 2px rgba(80,5,20,.6);}
  .t2048{--c1:rgba(108,26,46,.96);--c2:rgba(72,11,26,.96);--tc:#FFE9E4;--cs:rgba(90,20,40,.6);--ts:0 1px 2px rgba(60,0,15,.65);}
  .t-super{--c1:rgba(74,16,32,.97);--c2:rgba(46,7,18,.97);--tc:#FFE4DE;--cs:rgba(60,10,25,.6);--ts:0 1px 2px rgba(40,0,10,.7);}

  /* ===== 结束 / 胜利遮罩 ===== */
  .overlay{
    position:absolute;
    inset:0;
    z-index:20;
    display:grid;
    place-items:center;
    padding:20px;
    border-radius:34px;
    background:rgba(255,248,242,.55);
    backdrop-filter:blur(10px) saturate(1.4);
    -webkit-backdrop-filter:blur(10px) saturate(1.4);
    cursor:default;
  }
  .overlay[hidden]{display:none;}
  .panel{
    text-align:center;
    max-width:290px;
    padding:26px 22px 22px;
    border-radius:28px;
    background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.68));
    backdrop-filter:blur(20px) saturate(1.5);
    -webkit-backdrop-filter:blur(20px) saturate(1.5);
    box-shadow:
      0 26px 44px -24px rgba(150,86,64,.55),
      inset 0 1.5px 0 rgba(255,255,255,.95),
      inset 0 0 0 1px rgba(255,255,255,.5);
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:radial-gradient(120% 55% at 50% -20%, rgba(255,255,255,.9), rgba(255,255,255,0) 60%);
  }
  .panel > *{position:relative;z-index:1;}
  .panel-note{
    margin:0 0 6px;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--ink-2);
  }
  .panel-title{
    margin:0;
    font-family:"Fredoka","Segoe UI",system-ui,sans-serif;
    font-size:clamp(28px,8vw,36px);
    font-weight:700;
    line-height:1.1;
    letter-spacing:0;
  }
  .panel-text{
    margin:10px 0 18px;
    font-size:14px;
    line-height:1.7;
    color:var(--ink-2);
  }
  .panel-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .panel-actions .btn{width:auto;flex:1 1 92px;}

  @media (max-width:420px){
    .score-box,
    .btn{padding:0 14px;}
    .score-box .value{font-size:19px;}
  }
  @media (max-height:640px){
    .title{font-size:30px;margin-bottom:10px;}
    .scores{margin-bottom:10px;}
    .toolbar{margin-top:10px;}
  }
  @media (prefers-reduced-motion:reduce){
    .tile{transition:none;}
    .tile-inner.pop,.tile-inner.appear{animation:none;}
    .btn{transition:none;}
  }
</style>
</head>
<body>
<main class="shell">
  <h1 class="title">2048</h1>

  <div class="scores">
    <div class="score-box">
      <span class="label">分数</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="score-box score-box--best">
      <span class="label">最高</span>
      <span class="value" id="best">0</span>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" role="application" aria-label="2048 棋盘">
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="panel">
          <p class="panel-note" id="ovNote">已达 2048</p>
          <p class="panel-title" id="ovTitle">2048</p>
          <p class="panel-text" id="ovText">继续挑战更大的数字，或者重新开始。</p>
          <div class="panel-actions">
            <button type="button" class="btn btn--fill" id="ovPrimary">继续玩</button>
            <button type="button" class="btn btn--ghost" id="ovSecondary">再来一局</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button type="button" class="btn btn--solid" id="newGame">新游戏</button>
    <button type="button" class="btn btn--ghost" id="undo" disabled>撤销<span class="count" id="undoCount">0</span></button>
  </div>
</main>

<script>
(function(){
  'use strict';

  var N = 4;
  var HISTORY_MAX = 5;
  var STORE_KEY = 'doubao.game2048.state.v1';
  var BEST_KEY = 'doubao.game2048.best.v1';

  var boardEl = document.getElementById('board');
  var slotsEl = document.getElementById('slots');
  var tilesEl = document.getElementById('tiles');
  var overlayEl = document.getElementById('overlay');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var undoBtn = document.getElementById('undo');
  var undoCountEl = document.getElementById('undoCount');
  var newBtn = document.getElementById('newGame');
  var ovNote = document.getElementById('ovNote');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovPrimary = document.getElementById('ovPrimary');
  var ovSecondary = document.getElementById('ovSecondary');

  var grid = emptyGrid();
  var tiles = [];
  var seq = 0;
  var score = 0;
  var best = 0;
  var hasWon = false;
  var paused = false;
  var gameOver = false;
  var busy = false;
  var pendingDir = null;
  var history = [];
  var overlayMode = null;

  var cellSize = 0, gapPx = 0, padPx = 0;

  /* ===== 基础工具 ===== */
  function emptyGrid(){
    var g = [];
    for (var r = 0; r < N; r++){ g.push(new Array(N).fill(null)); }
    return g;
  }

  function computeMetrics(){
    var W = boardEl.clientWidth;
    if (!W) return;
    padPx = Math.round(W * 0.034);
    gapPx = Math.round(W * 0.021);
    cellSize = (W - padPx * 2 - gapPx * (N - 1)) / N;
    boardEl.style.setProperty('--pad', padPx + 'px');
    boardEl.style.setProperty('--gap', gapPx + 'px');
    boardEl.style.setProperty('--cell', cellSize + 'px');
  }

  function cellXY(r, c){
    return [padPx + c * (cellSize + gapPx), padPx + r * (cellSize + gapPx)];
  }

  function buildSlots(){
    slotsEl.innerHTML = '';
    for (var i = 0; i < N * N; i++){
      var s = document.createElement('div');
      s.className = 'slot';
      slotsEl.appendChild(s);
    }
  }

  /* ===== 方块 ===== */
  function valueClass(v){
    return v > 2048 ? 't-super' : 't' + v;
  }

  function paintTile(t){
    var s = String(t.v);
    t.val.textContent = s;
    t.inner.className = 'tile-inner ' + valueClass(t.v);
    var k = s.length <= 2 ? 0.42 : s.length === 3 ? 0.33 : s.length === 4 ? 0.27 : 0.21;
    t.inner.style.setProperty('--k', k);
  }

  function place(t, animate){
    if (!animate) t.el.classList.add('no-anim');
    var xy = cellXY(t.r, t.c);
    t.el.style.transform = 'translate3d(' + xy[0] + 'px,' + xy[1] + 'px,0)';
    if (!animate){
      void t.el.offsetWidth;
      requestAnimationFrame(function(){ t.el.classList.remove('no-anim'); });
    }
  }

  function makeTile(v, r, c){
    var el = document.createElement('div');
    el.className = 'tile';
    var inner = document.createElement('div');
    inner.className = 'tile-inner';
    var val = document.createElement('span');
    val.className = 'tile-val';
    inner.appendChild(val);
    el.appendChild(inner);
    tilesEl.appendChild(el);

    var t = { id: ++seq, v: v, r: r, c: c, el: el, inner: inner, val: val };
    paintTile(t);
    tiles.push(t);
    grid[r][c] = t;
    return t;
  }

  /* ===== 新块数值：档位衰减 0.65，最大块保底 1% ===== */
  var SPAWN_RATIO = 0.65;
  var SPAWN_TOP_FLOOR = 0.01;

  function boardMaxValue(){
    var max = 0, r, c, t;
    for (r = 0; r < N; r++){
      for (c = 0; c < N; c++){
        t = grid[r][c];
        if (t && t.v > max) max = t.v;
      }
    }
    return max;
  }

  function randomTileValue(){
    var max = boardMaxValue();
    if (!max) max = 4;               /* 空盘起步：2 或 4 */
    if (max <= 2) return 2;

    var tiers = Math.round(Math.log(max) / Math.LN2);   /* 候选 2 … max，共 tiers 档 */
    var weights = [], sum = 0, k, p = [];
    for (k = 0; k < tiers; k++){
      var w = Math.pow(SPAWN_RATIO, k);
      weights.push(w);
      sum += w;
    }
    for (k = 0; k < tiers; k++) p.push(weights[k] / sum);

    /* 最大块保底：自然概率不足 1% 时抬到 1%，其余档位等比例压缩 */
    if (p[tiers - 1] < SPAWN_TOP_FLOOR){
      var rest = 1 - p[tiers - 1];
      var scale = (1 - SPAWN_TOP_FLOOR) / rest;
      for (k = 0; k < tiers - 1; k++) p[k] *= scale;
      p[tiers - 1] = SPAWN_TOP_FLOOR;
    }

    var roll = Math.random(), acc = 0;
    for (k = 0; k < tiers; k++){
      acc += p[k];
      if (roll < acc) return Math.pow(2, k + 1);
    }
    return 2;
  }

  function spawn(animate){
    var empties = [];
    for (var r = 0; r < N; r++){
      for (var c = 0; c < N; c++){
        if (!grid[r][c]) empties.push([r, c]);
      }
    }
    if (!empties.length) return null;
    var pick = empties[Math.floor(Math.random() * empties.length)];
    var t = makeTile(randomTileValue(), pick[0], pick[1]);
    place(t, false);
    if (animate) t.inner.classList.add('appear');
    return t;
  }

  /* ===== 计分 ===== */
  function renderScore(){
    scoreEl.textContent = score.toLocaleString('en-US');
    if (score > best) best = score;
    bestEl.textContent = best.toLocaleString('en-US');
  }

  function updateUndo(){
    var left = history.length;
    undoCountEl.textContent = left;
    undoBtn.disabled = left === 0;
  }

  /* ===== 音效：Web Audio 合成，无外部文件 ===== */
  var audio = null;

  function ensureAudio(){
    if (audio){
      if (audio.state === 'suspended') audio.resume();
      return audio;
    }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { audio = new C(); } catch (e) { audio = null; }
    if (audio && audio.state === 'suspended') audio.resume();
    return audio;
  }

  function sweep(ctx, t, type, f0, bend, f1, dur, peak){
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (bend) o.frequency.exponentialRampToValueAtTime(bend, t + dur * 0.3);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0008, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  var noiseBuf = null;

  function getNoise(ctx){
    if (noiseBuf) return noiseBuf;
    var len = Math.max(64, Math.floor(ctx.sampleRate * 0.06));
    var b = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    noiseBuf = b;
    return b;
  }

  /* 一下脆弹：高频、极短衰减 */
  function plop(ctx, t, f, peak, dur, type){
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f * 1.045, t);
    o.frequency.exponentialRampToValueAtTime(f, t + dur * 0.55);
    g.gain.setValueAtTime(0.0008, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  /* 合成：高频瞬态 + 主体脆响 + 一个更亮的小泛音 */
  function sfxMerge(value, i){
    var ctx = ensureAudio();
    if (!ctx || ctx.state !== 'running') return;
    if (i > 1) return;
    var t = ctx.currentTime + (i ? 0.035 : 0);
    var lvl = Math.min(Math.log2(value) - 1, 11);
    var f = 1080 - lvl * 26;

    var src = ctx.createBufferSource();
    src.buffer = getNoise(ctx);
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.6;
    bp.frequency.setValueAtTime(3400, t);
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.055, t);
    ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.028);
    src.connect(bp);
    bp.connect(ng);
    ng.connect(ctx.destination);
    src.start(t);
    src.stop(t + 0.032);

    plop(ctx, t, f, 0.082, 0.075, 'triangle');
    plop(ctx, t + 0.032, f * 1.42, 0.036, 0.06, 'triangle');
    plop(ctx, t, f * 2.35, 0.014, 0.045, 'sine');
  }

  /* 合成时的一次短震动：多个合并也只触发一次，块越大时长略长（上限 34ms） */
  function buzz(value, i){
    if (i > 0) return;
    if (!navigator.vibrate) return;
    var lvl = Math.min(Math.log2(value) - 1, 11);
    try { navigator.vibrate(10 + lvl * 2); } catch (e) {}
  }

  function sfxClick(){
    var ctx = ensureAudio();
    if (!ctx || ctx.state !== 'running') return;
    var t = ctx.currentTime;
    sweep(ctx, t, 'triangle', 1040, 0, 900, 0.042, 0.068);
    sweep(ctx, t, 'sine', 2080, 0, 1760, 0.028, 0.026);
  }

  function sfxUndo(){
    var ctx = ensureAudio();
    if (!ctx || ctx.state !== 'running') return;
    var t = ctx.currentTime;
    sweep(ctx, t, 'triangle', 840, 0, 640, 0.06, 0.075);
    sweep(ctx, t + 0.05, 'sine', 640, 0, 470, 0.08, 0.045);
  }

  function sfxNew(){
    var ctx = ensureAudio();
    if (!ctx || ctx.state !== 'running') return;
    var t = ctx.currentTime;
    sweep(ctx, t, 'triangle', 680, 0, 840, 0.055, 0.075);
    sweep(ctx, t + 0.05, 'sine', 1040, 0, 1280, 0.085, 0.045);
  }

  document.addEventListener('pointerdown', ensureAudio, { once: true });
  document.addEventListener('keydown', ensureAudio, { once: true });

  /* ===== 移动 ===== */
  function buildLines(dir){
    var lines = [], i, j;
    if (dir === 'left' || dir === 'right'){
      for (i = 0; i < N; i++){
        var cs = dir === 'left' ? [0, 1, 2, 3] : [3, 2, 1, 0];
        var line = [];
        for (j = 0; j < N; j++) line.push([i, cs[j]]);
        lines.push(line);
      }
    } else {
      for (i = 0; i < N; i++){
        var rs = dir === 'up' ? [0, 1, 2, 3] : [3, 2, 1, 0];
        var line2 = [];
        for (j = 0; j < N; j++) line2.push([rs[j], i]);
        lines.push(line2);
      }
    }
    return lines;
  }

  function capture(){
    var cells = [], r, c, t;
    for (r = 0; r < N; r++){
      for (c = 0; c < N; c++){
        t = grid[r][c];
        if (t) cells.push({ v: t.v, r: r, c: c });
      }
    }
    return { cells: cells, score: score, hasWon: hasWon };
  }

  function move(dir){
    if (busy){ pendingDir = dir; return; }
    if (paused || gameOver) return;

    var snapshot = capture();
    var lines = buildLines(dir);
    var losers = [];
    var winners = [];
    var moved = false;
    var gained = 0;
    var li, ti, out, k, line, ts, tr, tc, main, other;

    for (li = 0; li < lines.length; li++){
      line = lines[li];
      ts = [];
      for (ti = 0; ti < line.length; ti++){
        var cellTile = grid[line[ti][0]][line[ti][1]];
        if (cellTile) ts.push(cellTile);
        grid[line[ti][0]][line[ti][1]] = null;
      }

      out = [];
      ti = 0;
      while (ti < ts.length){
        if (ti + 1 < ts.length && ts[ti].v === ts[ti + 1].v){
          out.push({ main: ts[ti], other: ts[ti + 1], v: ts[ti].v * 2 });
          ti += 2;
        } else {
          out.push({ main: ts[ti], v: ts[ti].v });
          ti += 1;
        }
      }

      for (k = 0; k < out.length; k++){
        tr = line[k][0];
        tc = line[k][1];
        main = out[k].main;
        if (main.r !== tr || main.c !== tc) moved = true;
        main.r = tr;
        main.c = tc;
        grid[tr][tc] = main;

        if (out[k].other){
          moved = true;
          other = out[k].other;
          other.r = tr;
          other.c = tc;
          losers.push(other);
          main.v = out[k].v;
          winners.push(main);
          gained += out[k].v;
        }
      }
    }

    if (!moved){
      renderScore();
      return;
    }

    busy = true;

    if (history.length >= HISTORY_MAX) history.shift();
    history.push(snapshot);

    for (var t = 0; t < tiles.length; t++) place(tiles[t], true);

    for (var w = 0; w < winners.length; w++){
      paintTile(winners[w]);
      winners[w].inner.classList.add('pop');
      winners[w].el.style.zIndex = '3';
      sfxMerge(winners[w].v, w);
      buzz(winners[w].v, w);
      winners[w].inner.addEventListener('animationend', function(ev){
        ev.currentTarget.classList.remove('pop');
      }, { once: true });
    }
    for (var l = 0; l < losers.length; l++) losers[l].el.style.zIndex = '1';

    if (gained) score += gained;
    renderScore();
    updateUndo();

    window.setTimeout(function(){
      for (var j = 0; j < losers.length; j++){
        losers[j].el.remove();
        var idx = tiles.indexOf(losers[j]);
        if (idx > -1) tiles.splice(idx, 1);
      }
      for (var n = 0; n < tiles.length; n++) tiles[n].el.style.zIndex = '';

      spawn(true);
      busy = false;
      updateUndo();
      checkState();
      save();

      if (pendingDir){
        var d = pendingDir;
        pendingDir = null;
        move(d);
      }
    }, 125);
  }

  /* ===== 状态判定 ===== */
  function canMove(){
    var r, c, t;
    for (r = 0; r < N; r++){
      for (c = 0; c < N; c++){
        t = grid[r][c];
        if (!t) return true;
        if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
        if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
      }
    }
    return false;
  }

  function checkState(){
    if (!hasWon){
      for (var i = 0; i < tiles.length; i++){
        if (tiles[i].v === 2048){ hasWon = true; paused = true; showWin(); return; }
      }
    }
    if (!canMove()){ gameOver = true; showOver(); }
  }

  /* ===== 遮罩 ===== */
  function showWin(){
    overlayMode = 'win';
    ovNote.textContent = '已达 2048';
    ovTitle.textContent = '2048';
    ovText.textContent = '方块到了终点，但棋局还没结束。继续玩，看还能走多远。';
    ovPrimary.textContent = '继续玩';
    ovSecondary.textContent = '再来一局';
    ovSecondary.disabled = false;
    overlayEl.hidden = false;
    save();
  }

  function showOver(){
    overlayMode = 'over';
    ovNote.textContent = '无法继续';
    ovTitle.textContent = '本局结束';
    ovText.textContent = '本局得分 ' + score.toLocaleString('en-US') + '，最高 ' + Math.max(best, score).toLocaleString('en-US') + '。';
    ovPrimary.textContent = '再来一局';
    ovSecondary.textContent = '退回一步';
    ovSecondary.disabled = history.length === 0;
    overlayEl.hidden = false;
    save();
  }

  function hideOverlay(){
    overlayEl.hidden = true;
    overlayMode = null;
  }

  /* ===== 局面重建 ===== */
  function clearBoard(){
    for (var i = 0; i < tiles.length; i++) tiles[i].el.remove();
    tiles = [];
    grid = emptyGrid();
  }

  function restore(state){
    clearBoard();
    score = state.score;
    hasWon = !!state.hasWon;
    paused = false;
    gameOver = false;
    for (var i = 0; i < state.cells.length; i++){
      var c = state.cells[i];
      var t = makeTile(c.v, c.r, c.c);
      place(t, false);
    }
    renderScore();
    updateUndo();
    hideOverlay();
    save();
  }

  function newGame(){
    sfxNew();
    clearBoard();
    score = 0;
    hasWon = false;
    paused = false;
    gameOver = false;
    busy = false;
    pendingDir = null;
    history = [];
    hideOverlay();
    renderScore();
    updateUndo();
    spawn(true);
    spawn(true);
    save();
  }

  function undo(){
    if (busy || paused) return;
    if (!history.length) return;
    var st = history.pop();
    sfxUndo();
    restore(st);
  }

  /* ===== 存档 ===== */
  function save(){
    try {
      var cells = [], r, c;
      for (r = 0; r < N; r++){
        for (c = 0; c < N; c++){
          if (grid[r][c]) cells.push({ v: grid[r][c].v, r: r, c: c });
        }
      }
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        cells: cells, score: score, hasWon: hasWon
      }));
      window.localStorage.setItem(BEST_KEY, String(best));
    } catch (e) {}
  }

  function load(){
    try { best = parseInt(window.localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { best = 0; }

    var raw = null;
    try { raw = window.localStorage.getItem(STORE_KEY); } catch (e) {}
    if (raw){
      try {
        var st = JSON.parse(raw);
        if (st && st.cells && st.cells.length){
          score = st.score || 0;
          hasWon = !!st.hasWon;
          for (var i = 0; i < st.cells.length; i++){
            var c = st.cells[i];
            var t = makeTile(c.v, c.r, c.c);
            place(t, false);
          }
          renderScore();
          updateUndo();
          if (!canMove()){ gameOver = true; showOver(); }
          return;
        }
      } catch (e2) {}
    }
    newGame();
  }

  /* ===== 输入 ===== */
  var KEYMAP = {
    arrowleft: 'left', arrowright: 'right', arrowup: 'up', arrowdown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down'
  };

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (overlayMode){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ovPrimary.click(); }
      return;
    }
    var dir = KEYMAP[String(e.key).toLowerCase()];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  /* ===== 拖动：方块跟手位移，松手弹性回位 ===== */
  var drag = null;
  var DRAG_LIMIT = 3;
  var DRAG_GAIN = 1;

  function dragBegin(x, y){
    if (overlayMode) return;
    drag = { x: x, y: y, dx: 0, dy: 0 };
    tilesEl.classList.add('live');
    boardEl.classList.add('dragging');
  }

  function dragMove(x, y){
    if (!drag) return;
    drag.dx = x - drag.x;
    drag.dy = y - drag.y;
    var ox = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, drag.dx * DRAG_GAIN));
    var oy = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, drag.dy * DRAG_GAIN));
    tilesEl.style.transform = 'translate3d(' + ox + 'px,' + oy + 'px,0)';
  }

  function dragRelease(){
    if (!drag) return;
    var dx = drag.dx;
    var dy = drag.dy;
    drag = null;
    tilesEl.classList.remove('live');
    tilesEl.style.transform = 'translate3d(0,0,0)';
    boardEl.classList.remove('dragging');
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }

  boardEl.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) return;
    dragBegin(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  boardEl.addEventListener('touchmove', function(e){
    if (!drag || e.touches.length !== 1) return;
    e.preventDefault();
    dragMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  boardEl.addEventListener('touchend', function(){ dragRelease(); }, { passive: true });

  boardEl.addEventListener('touchcancel', function(){
    if (!drag) return;
    drag = null;
    tilesEl.classList.remove('live');
    tilesEl.style.transform = 'translate3d(0,0,0)';
    boardEl.classList.remove('dragging');
  }, { passive: true });

  boardEl.addEventListener('mousedown', function(e){
    if (e.button !== 0 || overlayMode) return;
    e.preventDefault();
    dragBegin(e.clientX, e.clientY);
  });

  document.addEventListener('mousemove', function(e){
    if (drag) dragMove(e.clientX, e.clientY);
  });

  document.addEventListener('mouseup', function(){ dragRelease(); });

  window.addEventListener('blur', function(){
    if (!drag) return;
    drag = null;
    tilesEl.classList.remove('live');
    tilesEl.style.transform = 'translate3d(0,0,0)';
    boardEl.classList.remove('dragging');
  });

  /* ===== 按钮 ===== */
  newBtn.addEventListener('click', newGame);
  undoBtn.addEventListener('click', undo);

  ovPrimary.addEventListener('click', function(){
    if (overlayMode === 'win'){
      sfxClick();
      paused = false;
      hideOverlay();
      save();
    } else if (overlayMode === 'over'){
      newGame();
    }
  });

  ovSecondary.addEventListener('click', function(){
    if (overlayMode === 'win'){
      newGame();
    } else if (overlayMode === 'over'){
      hideOverlay();
      gameOver = false;
      undo();
    }
  });

  /* ===== 尺寸适配 ===== */
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function(){
      computeMetrics();
      for (var i = 0; i < tiles.length; i++) place(tiles[i], false);
    }, 90);
  });

  /* ===== 启动 ===== */
  buildSlots();
  computeMetrics();
  load();
  if (!history.length) updateUndo();
  window.setTimeout(function(){
    computeMetrics();
    for (var i = 0; i < tiles.length; i++) place(tiles[i], false);
  }, 60);
})();
</script>
</body>
</html>
